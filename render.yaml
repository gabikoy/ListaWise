databases:
  - name: listawise-db
    databaseName: listawise_db
    user: listawise
    plan: free
    region: singapore

services:
  - type: web
    name: listawise-api
    runtime: node
    region: singapore
    plan: free
    rootDir: ListaWise-System/backend
    buildCommand: npm ci
    startCommand: node setup-database.js && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: listawise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
